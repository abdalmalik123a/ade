#diwan-m13-review .dw-work{display:grid;grid-template-columns:62px minmax(0,1fr) 268px;direction:ltr;gap:10px;flex:1;min-height:446px}#diwan-m13-review .dw-tools{background:var(--dw-paper);border-radius:14px 5px 14px 5px;padding:5px;display:flex;flex-direction:column;gap:5px;align-self:start}#diwan-m13-review .dw-tools button{padding:7px 2px;flex-direction:column;min-height:45px;font-size:12px;line-height:1.35}

  root.querySelectorAll('.dw-app').forEach((app,index) => {

    const state = { tool:photo?'keep':'select', side:'front', text:'زينب علي حسن', hidden:false, locked:false, zoom:100, font:22, brush:24, soft:40, layer:'name', ruler:true };
    function restore(scene){
      if(!scene||typeof scene!=='object')return;
      for(const key of ['hidden','locked','ruler'])if(typeof scene[key]==='boolean')state[key]=scene[key];
      if(typeof scene.text==='string')state.text=scene.text.slice(0,160);

      if((photo?toolsPhoto:toolsDesign).some(t=>t[0]===scene.tool))state.tool=scene.tool;
      if(['front','back'].includes(scene.side))state.side=scene.side;
      if(['name','school','photo','class','decor','bg'].includes(scene.layer))state.layer=scene.layer;

    restore(saved?.scenes?.[index]);
    const size = photo?'٣٥ × ٤٥ ملم · ٦٠٠ نقطة':'٨٥٫٦ × ٥٤ ملم · نزف ٣ ملم';
    const rail = `<nav class="dw-rail" aria-label="وجهات ديوان"><strong>ديوان</strong>${[['store','الشبّاك'],['clipboard-list','قيد العمل'],['history','السجلّ'],['users','الزبائن'],['library','المكتبة']].map(([i,t],n)=>btn('nav',icon(i)+t,n===0?'class="dw-current"':'')).join('')}<span class="dw-spacer"></span>${btn('settings',icon('settings')+'الإعدادات')}</nav>`;
    const props = `<section class="dw-panel dw-properties ${floating?'dw-floating':''}" aria-label="الخصائص"><h3>${floating?btn('panel-move',icon('grip'),'class="dw-panel-move" aria-label="تحريك الخصائص: اسحب أو استخدم الأسهم"'):icon('grip')}الخصائص <span class="dw-small">${photo?'الأداة المختارة':'العنصر المحدّد'}</span>${floating?btn('panel-reset',icon('rotate-ccw'),'class="dw-panel-move" aria-label="أعد موضع الخصائص"'):''}</h3><div data-properties></div></section>`;
    const layers = `<section class="dw-panel dw-layers" aria-label="الطبقات"><h3>الطبقات <span class="dw-small">٦ عناصر</span></h3><div data-layers></div><div class="dw-small">العين للإخفاء · القفل لحماية العنصر</div></section>`;
    const steps = `<section class="dw-panel" aria-label="خطوات الصورة"><h3>خطوات الصورة</h3><ol class="dw-steps">${[['الصورة','صورة مولّدة'],['الخلفية','أبيض'],['الإضاءة واللون','تلقائي'],['القاط','بلا قاط'],['المقاس','٣٥ × ٤٥ ملم'],['الإخراج','٦ نسخ']].map(([t,v],n)=>`<li>${btn('step-'+n,`<span class="dw-step-no">${'١٢٣٤٥٦'[n]}</span>${t}`)}<span>${v}</span></li>`).join('')}</ol></section>`;
    app.innerHTML = `<div class="dw-main"><header class="dw-top"><div class="dw-name"><div class="dw-small">الشبّاك / ${photo?'الصور الشخصية':'شهادات وتصاميم'}</div><h2 class="dw-title">${photo?'صورة معاملة':'هوية طالب — مدرسة النور'}</h2></div><span class="dw-badge">مقترح للمراجعة</span>${btn('save',icon('save')+'حفظ')}</header><div class="dw-menus">${(photo?menus.filter(m=>m[0]!=='batch'&&m[0]!=='page'):menus).map(([a,t])=>btn(a,t)).join('')}<span class="dw-push"></span>${btn('undo',icon('undo-2'),'aria-label="تراجع"')}${!photo?btn('front','الوجه','aria-pressed="true"')+btn('back','الظهر','aria-pressed="false"'):''}</div><div class="dw-options" data-options aria-label="خيارات الأداة"></div><div class="dw-work"><aside class="dw-tools" aria-label="أدوات ${photo?'الصور':'التصاميم'}">${(photo?toolsPhoto:toolsDesign).map(([a,i,t])=>btn('tool-'+a,icon(i)+t,`aria-label="أداة ${t}" aria-pressed="${state.tool===a}"`)).join('')}</aside><section class="dw-stage" data-stage aria-label="لوحة العمل"><div class="dw-ruler-x" aria-label="مسطرة أفقية بالملم">${[0,10,20,30,40,50,60,70,80].map(n=>`<span>${n}</span>`).join('')}</div><div class="dw-ruler-y" aria-label="مسطرة عمودية بالملم">٠ ١٠ ٢٠ ٣٠ ٤٠ ٥٠</div><div class="dw-sheet ${photo?'dw-photo':'dw-design'}" data-sheet></div>${floating?props:''}</section><aside class="dw-side" aria-label="لوحات العمل">${floating?'':props}${photo?steps:layers}</aside></div><div class="dw-status"><span>${size}</span><label>التكبير <input aria-label="التكبير بالنسبة المئوية" data-zoom type="number" min="50" max="100" value="100"></label><output aria-live="polite" data-status>مقترح ${floating?'بخصائص عائمة':'بلوحات ثابتة'}</output></div><footer class="dw-bottom"><span class="dw-small">${photo?'الأصل محفوظ · الوجه لا يُغيَّر':'التصميم والحقول والدفعة في مكان واحد'}</span>${btn('export',photo?'احفظ الصورة':'احفظ صورة / PDF')}${btn('review',icon('printer')+(photo?'راجع الورقة واطبع':'راجع الأوراق واطبع'),'class="dw-primary"')}</footer></div>${rail}`;
    app.querySelector('[data-action=review]').classList.add('dw-primary');
    app.querySelector('[data-action=nav]').classList.add('dw-current');
    const q = s => app.querySelector(s);
    const say = text => { q('[data-status]').textContent=text; };
    const persist = () => { const scenes=[...root.querySelectorAll('.dw-app')].map(a=>a._state); window.openai?.setWidgetState?.({modelContent:{scenes},privateContent:null})?.catch(()=>{}); };
    app._state=state;
    function updateRulers(){
      const stage=q('[data-stage]').getBoundingClientRect(),sheet=q('[data-sheet]').getBoundingClientRect();
      if(!stage.width||!sheet.width)return;
      const width=photo?35:85.6,height=photo?45:54;
      q('.dw-ruler-x').innerHTML=Array.from({length:Math.floor(width/10)+1},(_,k)=>`<span style="left:${sheet.left-stage.left-22+k*10/width*sheet.width}px">${k*10}</span>`).join('');
      q('.dw-ruler-y').innerHTML=Array.from({length:Math.floor(height/10)+1},(_,k)=>`<span style="top:${sheet.top-stage.top-23+k*10/height*sheet.height}px">${k*10}</span>`).join('');
    }
    function drawSheet() {
      requestAnimationFrame(updateRulers);
      if (photo) { q('[data-sheet]').innerHTML=`<img alt="صورة مولدة لعرض مساحة العمل، لا بيانات مواطن" src="${face}"><span class="dw-guide"></span><span class="dw-guide"></span>${['keep','remove','repair'].includes(state.tool)?'<span class="dw-brush"></span>':''}`; q('[data-sheet]').classList.toggle('dw-crop',state.tool==='crop'); return; }
      q('[data-sheet]').innerHTML=state.side==='back'?`<div class="dw-back"><div class="dw-title">مدرسة النور</div><div>هذه الهوية خاصة بصاحبها</div><div class="dw-small">العنوان · هاتف المدرسة</div></div>`:`<div class="dw-card-head">مدرسة النور الابتدائية <div class="dw-small" style="color:inherit">هوية طالب · العام الدراسي ٢٠٢٦–٢٠٢٧</div></div><div class="dw-card-body"><div class="dw-fields"><div data-name contenteditable="${!state.locked}" role="textbox" aria-label="اسم الطالب على اللوحة" class="dw-name-text ${state.layer==='name'?'dw-selected':''}" style="${state.hidden?'visibility:hidden;':''}font-size:${state.font}px"></div><div>الصف: الخامس الابتدائي</div><div class="dw-small">الرقم: ٠٠٢٤</div></div><div class="dw-avatar" aria-label="موضع صورة الطالب"></div></div><div class="dw-card-foot">هويّة مدرسية · نموذج ببيانات مصنوعة</div>`;
      if(q('[data-name]')) q('[data-name]').textContent=state.text;
    }
    function drawLayers() {
      if(photo) return;
      const items=[['name','نص','اسم الطالب'],['school','نص','مدرسة النور'],['photo','صورة','صورة الطالب'],['class','حقل','الصف'],['decor','شكل','الإطار'],['bg','شكل','الخلفية']];
      q('[data-layers]').innerHTML=items.map(([id,k,label])=>`<div class="dw-layer">${btn('layer-'+id,`<span class="dw-kind">${k==='نص'?'T':k==='حقل'?'{}':'□'}</span>${label}`,`aria-pressed="${state.layer===id}" aria-label="حدد طبقة ${label}"`)}${btn('eye-'+id,icon(id==='name'&&state.hidden?'eye-off':'eye'),`aria-label="${id==='name'&&state.hidden?'أظهر':'أخفِ'} ${label}"`)}${btn('lock-'+id,icon(id==='name'&&state.locked?'lock':'lock-open'),`aria-label="${id==='name'&&state.locked?'افتح قفل':'اقفل'} ${label}"`)}</div>`).join('');
    }
    function drawOptions() {
      const selected=(photo?toolsPhoto:toolsDesign).find(t=>t[0]===state.tool)?.[2]??'تحديد';
      q('[data-options]').innerHTML=`<span class="dw-title">${selected}</span>`+(photo?(['keep','remove','repair'].includes(state.tool)?`<label>الحجم <input data-brush type="range" min="3" max="80" value="${state.brush}" aria-label="حجم الفرشاة"><span data-brush-value>${state.brush}</span></label><label>النعومة <input data-soft type="range" min="10" max="90" value="${state.soft}" aria-label="نعومة الحافة"></label>`:state.tool==='color'?'<label>السماح <input type="range" min="1" max="120" value="32" aria-label="سماح محو اللون"></label><label>النطاق <select aria-label="نطاق محو اللون"><option>المتجاور</option><option>كل اللون</option></select></label>':state.tool==='crop'?'<span>٣٥ × ٤٥ ملم</span><span class="dw-small">تحريك الصورة داخل المقاس</span>':state.tool==='suit'?btn('suits','اختر القاط'):'<span class="dw-small">تحريك الصورة ومعاينة المقاس</span>'):(['text','field'].includes(state.tool)?'<label>الخط <select aria-label="خط النص"><option>IBM Plex Sans Arabic</option><option>Amiri</option></select></label><label>الحجم <input data-font type="number" min="12" max="36" aria-label="حجم النص بالنقاط" value="'+state.font+'"></label><span class="dw-small">اختر موضع الكتابة على اللوحة</span>':state.tool==='select'?'<span class="dw-small">انقر عنصرًا أو اختر طبقته</span>'+btn('align','توسيط'):'<span class="dw-small">انقر اللوحة لإضافة العنصر في المقترح</span>'));
      q('[data-properties]').innerHTML=photo?`<label>الأداة<input aria-label="اسم الأداة" value="${selected}" readonly></label><div class="dw-prop-grid"><label>المقاس<select aria-label="مقاس الصورة"><option>٣٥ × ٤٥ ملم</option><option>٤٠ × ٦٠ ملم</option></select></label><label>النسخ<input type="number" value="6" min="1" max="30" aria-label="عدد النسخ"></label><label class="dw-full">الخلفية<select data-background aria-label="لون الخلفية"><option>أبيض</option><option>أزرق فاتح</option><option>الأصلية</option></select></label></div><div class="dw-small" style="margin-top:8px">${state.tool==='repair'?'الترميم تحت الذقن فقط، كما في ديوان اليوم':'معاينة الخيارات؛ الفرشاة لا تغيّر الصورة في هذا العرض'}</div>`:`<label>النص<input data-text aria-label="نص العنصر المحدد"></label><div class="dw-prop-grid"><label>الحجم<input data-font type="number" min="12" max="36" value="${state.font}" aria-label="حجم خط العنصر"></label><label>العرض<input aria-label="عرض العنصر بالملم" type="number" value="45" min="1"></label><label>المحاذاة<select aria-label="محاذاة النص"><option>يمين</option><option>وسط</option><option>يسار</option></select></label><label>الشفافية<input type="number" min="0" max="100" value="100" aria-label="شفافية العنصر"></label></div>`;
      if(q('[data-text]')) q('[data-text]').value=state.text;
      if(!photo&&state.layer!=='name'){
        const label={school:'مدرسة النور',photo:'صورة الطالب',class:'الصف',decor:'الإطار',bg:'الخلفية'}[state.layer]??'العنصر';
        q('[data-properties]').innerHTML='<label>العنصر<input readonly aria-label="اسم الطبقة المحددة"></label><div class="dw-small" style="margin-top:10px">اختيار الطبقة يبدل خصائصها. تحرير الاسم متاح في هذا المقترح.</div>';
        q('[data-properties] input').value=label;
      }
      app.querySelectorAll('[data-action^="tool-"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.action==='tool-'+state.tool)));
      if(window.lucide) window.lucide.createIcons({attrs:{width:16,height:16}});
    }
    function openDialog(type) {
      const names={batch:'تعبئة ودفعة',review:'مراجعة الأوراق',page:'الصفحة والاستيراد',file:'ملف التصميم',edit:'تحرير',view:'عرض',export:'حفظ صورة أو PDF',save:'حفظ',settings:'الإعدادات',suits:'القاط',nav:'الوجهات'};
      let content=type==='batch'?'<label>قائمة الأسماء<textarea aria-label="قائمة الأسماء المصنوعة">زينب علي حسن\nسالم حسن علي</textarea></label><table><thead><tr><th>الاسم</th><th>الصف</th></tr></thead><tbody><tr><td>زينب علي حسن</td><td>الخامس</td></tr><tr><td>سالم حسن علي</td><td>الخامس</td></tr></tbody></table><div class="dw-small">من Excel أو سجل الزبائن، وربط الأعمدة يبقى كما هو.</div>':type==='review'?'<div class="dw-title">'+(photo?'٦ صور · ٣٥ × ٤٥ ملم':'اسمان · وجه وظهر · علامات القصّ')+'</div><p>المراجعة قبل الطباعة تبقى خطوة ظاهرة.</p><div class="dw-small">هذه معاينة لترتيب النافذة؛ لن تُرسل ورقة إلى الطابعة.</div>':type==='page'?'<div class="dw-prop-grid"><label>العرض بالملم<input value="85.6" type="number"></label><label>الارتفاع بالملم<input value="54" type="number"></label><label>النزف بالملم<input value="3" type="number"></label></div><p>الخلفية · طقم الجهة · استيراد Word وPSD وPDF · ما جرى في الاستيراد</p>':type==='view'?'<label><input data-ruler-toggle type="checkbox" '+(state.ruler?'checked':'')+'> إظهار المسطرة</label>':type==='edit'?'<p>نسخ · لصق · تكرار · تجميع · ترتيب</p><div class="dw-small">الأفعال القائمة تبقى بأسمائها واختصاراتها.</div>':'<p>يبقى هذا المدخل في مكان واضح داخل مساحة العمل.</p><div class="dw-small">عرض للمراجعة، دون حفظ ملفات أو تطبيق تعديل فعلي على الصور.</div>';
      const overlay=document.createElement('div');overlay.className='dw-overlay';overlay.innerHTML=`<section class="dw-dialog" role="dialog" aria-modal="true" aria-label="${names[type]??'خيارات الصورة'}">${btn('close','أغلق','class="dw-close"')}<h3>${names[type]??'خيارات الصورة'}</h3>${content}</section>`;app.append(overlay);overlay.querySelector('button').focus();
    }
    app.addEventListener('click',e=>{
      const a=e.target.closest('[data-action]')?.dataset.action;
      if(a){
        if(a==='close'){q('.dw-overlay')?.remove();say('أُغلقت المعاينة');return;}
        if(a==='panel-move'){say('اسحب الخصائص أو حرّكها بالأسهم');}
        else if(a==='panel-reset'){q('.dw-floating').style.transform='translate(0px,0px)';say('عاد موضع الخصائص');}
        else if(a.startsWith('tool-')){state.tool=a.slice(5);drawOptions();if(photo)drawSheet();say(photo?'معاينة خيارات '+(toolsPhoto.find(t=>t[0]===state.tool)?.[2]??'الأداة'):'الأداة مختارة؛ العمل على اللوحة');}
        else if(a==='front'||a==='back'){state.side=a;drawSheet();q('[data-action=front]').setAttribute('aria-pressed',String(a==='front'));q('[data-action=back]').setAttribute('aria-pressed',String(a==='back'));say(a==='front'?'الوجه':'الظهر');}
        else if(a.startsWith('layer-')){state.layer=a.slice(6);drawLayers();drawSheet();drawOptions();say('الطبقة محددة في المقترح');}
        else if(a.startsWith('eye-')||a.startsWith('lock-')){if(a.endsWith('-name')){if(a.startsWith('eye-'))state.hidden=!state.hidden;else state.locked=!state.locked;drawLayers();drawSheet();say(state.locked?'العنصر مقفل':'تغيّر ظهور العنصر');}else say('يمكن إظهار هذه الطبقة أو قفلها في الواجهة المعتمدة');}
        else if(a==='undo'){state.text='زينب علي حسن';state.hidden=false;state.locked=false;state.font=22;drawSheet();drawLayers();drawOptions();say('أُعيد مثال النص في المقترح');}
        else if(a==='align'){const name=q('[data-name]');if(name)name.style.textAlign='center';say('توسيط العنصر في المقترح');}
        else if(a.startsWith('step-')){say('الخطوة '+a.slice(5)+' لها مدخلها الظاهر؛ الأصل والخطوات باقية');}
        else openDialog(a);
        persist();return;
      }
      if(!photo&&e.target.closest('[data-sheet]')&&state.side==='front'){
        if(state.tool==='text'){const name=q('[data-name]');if(name&&!state.locked){name.focus();const s=getSelection();s.selectAllChildren(name);say('اكتب على اللوحة؛ النص يتغير في الخصائص');}}
        else if(!['select','image','barcode'].includes(state.tool)){let added=q('.dw-added');if(!added){added=document.createElement('div');added.className='dw-added';q('[data-sheet]').append(added);}added.textContent=state.tool==='table'?'جدول: الاسم | الصف':state.tool==='field'?'{الاسم}':'شكل جديد';say('أُضيف عنصر عرض فقط');}
        else{state.layer='name';drawLayers();say('اسم الطالب محدد');}
      }
    });
    app.addEventListener('input',e=>{
      if(e.target.matches('[data-text]')){state.text=e.target.value;if(q('[data-name]'))q('[data-name]').textContent=state.text;say('تعديل في المقترح');}
      if(e.target.matches('[data-name]')){state.text=e.target.textContent;if(q('[data-text]'))q('[data-text]').value=state.text;say('الكتابة على اللوحة');}
      if(e.target.matches('[data-font]')){state.font=Math.min(36,Math.max(12,Number(e.target.value)||12));if(q('[data-name]'))q('[data-name]').style.fontSize=state.font+'px';}
      if(e.target.matches('[data-brush]')){state.brush=+e.target.value;q('[data-brush-value]').textContent=state.brush;const b=q('.dw-brush');if(b)b.style.width=b.style.height=state.brush+'px';say('معاينة حجم المؤشر: '+state.brush);}
      if(e.target.matches('[data-soft]')){state.soft=+e.target.value;say('نعومة الحافة: '+state.soft+'٪ في المقترح');}
      if(e.target.matches('[data-zoom]')){state.zoom=Math.min(100,Math.max(50,+e.target.value||100));q('[data-sheet]').style.transform='scale('+state.zoom/100+')';requestAnimationFrame(updateRulers);say('تكبير المعاينة: '+state.zoom+'٪');}
      persist();
    });
    app.addEventListener('change',e=>{if(e.target.matches('[data-ruler-toggle]')){state.ruler=e.target.checked;app.querySelectorAll('.dw-ruler-x,.dw-ruler-y').forEach(r=>r.hidden=!state.ruler);persist();}if(e.target.matches('[data-background]'))say('خيار الخلفية: '+e.target.value+'؛ لا معالجة صورة في هذا العرض');});
    app.addEventListener('keydown',e=>{if(e.key==='Escape')q('.dw-overlay')?.remove();const modal=q('.dw-overlay');if(e.key==='Tab'&&modal){const all=[...modal.querySelectorAll('button,input,select,textarea')];if(e.shiftKey&&document.activeElement===all[0]){all.at(-1).focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===all.at(-1)){all[0].focus();e.preventDefault();}}});
    if(floating){const panel=q('.dw-floating'),handle=panel.querySelector('h3');let drag=null;
      const position=()=>{const m=panel.style.transform.match(/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/);return m?{x:+m[1],y:+m[2]}:{x:0,y:0};};
      const move=(x,y)=>{const stage=q('[data-stage]').getBoundingClientRect();panel.style.transform=`translate(${Math.max(-15,Math.min(stage.width-panel.offsetWidth-50,x))}px,${Math.max(-10,Math.min(100,y))}px)`;};
      handle.addEventListener('pointerdown',e=>{if(app.clientWidth<850||e.target.closest('[data-action=panel-reset]'))return;drag={x:e.clientX,y:e.clientY,base:position()};handle.setPointerCapture(e.pointerId);});handle.addEventListener('pointermove',e=>{if(drag)move(drag.base.x+e.clientX-drag.x,drag.base.y+e.clientY-drag.y);});handle.addEventListener('pointerup',()=>{drag=null;});
      q('[data-action=panel-move]').addEventListener('keydown',e=>{if(app.clientWidth<850||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;const p=position();move(p.x+(e.key==='ArrowRight'?10:e.key==='ArrowLeft'?-10:0),p.y+(e.key==='ArrowDown'?10:e.key==='ArrowUp'?-10:0));e.preventDefault();});
    }
    function refresh(){drawSheet();drawLayers();drawOptions();q('[data-zoom]').value=state.zoom;q('[data-sheet]').style.transform='scale('+state.zoom/100+')';app.querySelectorAll('.dw-ruler-x,.dw-ruler-y').forEach(r=>r.hidden=!state.ruler);if(!photo){q('[data-action=front]').setAttribute('aria-pressed',String(state.side==='front'));q('[data-action=back]').setAttribute('aria-pressed',String(state.side==='back'));}}
    refresh();
    new ResizeObserver(updateRulers).observe(app);
    window.addEventListener('openai:set_globals',event=>{
      const scene=event.detail?.globals?.widgetState?.modelContent?.scenes?.[index];
      if(scene){restore(scene);refresh();}
    });
    if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>{app.querySelectorAll('.dw-ruler-x,.dw-ruler-y').forEach(r=>r.hidden=!state.ruler);}});tweak.addToggle(state,'ruler',{label:'إظهار المسطرة'});}
  });
})();
</script>
